- id: SRV-PHY-01
  name: Physical access to servers is restricted and logged
  plat: All
  obj: Prevent unauthorised physical access to server hardware, consoles and storage.
  biz: Physical access bypasses most logical controls and can lead to data theft, tampering or prolonged outage.
  thr: Hardware tampering, console and boot-media attacks, drive theft, rogue device insertion.
  q: Are servers housed in locked racks or access-controlled rooms, with access limited to authorised staff and logged?
  type: Preventive
  ev: Authorised access list; badge and visitor logs (90 days); CCTV coverage evidence; photos of rack locks; physical security policy; colocation contract and assurance report if hosted
  proc: |-
    1. Interview the facilities owner and obtain the authorised-access list.
    2. Walk the server room: check rack locks, door controls, cameras and visitor escort practice.
    3. Sample 10 names on the list against HR leavers and job roles; review badge logs for after-hours entry.
    4. For hosted or colocation sites, obtain the provider SOC 2 Type II or ISO 27001 certificate and confirm physical controls are in scope.
  test: INT,DOC,OBS
  auto: Low
  autom: Badge-system export compared with the HR leaver list (CSV reconciliation).
  L: 2
  I: 5
  w: 2
  m1: Servers sit in open or shared areas; access is ad hoc and unlogged.
  m3: Locked room or racks, documented access list, logs retained and reviewed annually.
  m5: Multi-factor physical entry, CCTV with retention, quarterly access recertification, automated leaver revocation and anomaly alerts.
  rem: Move servers into locked racks or rooms, define the authorised list, enable badge logging and CCTV, and recertify access at least quarterly for sensitive sites.
  iso: A.7.1, A.7.2, A.7.4, A.7.6
  csf: PR.AA-06
  cis: N/A
  soc: CC6.4
  att: 'IA:T1200'
  zt: IN
  orig: '1.1'

- id: SRV-PHY-02
  name: Out-of-band management interfaces are isolated and hardened
  plat: All
  obj: Ensure BMC, iDRAC, iLO, IPMI and KVM-over-IP interfaces cannot be used to take over servers.
  biz: A compromised BMC gives console, power and virtual-media control that sits below the operating system and its security tooling.
  thr: BMC firmware and IPMI protocol exploitation, default credentials, firmware implants, remote console takeover.
  q: Are out-of-band management interfaces on a dedicated management network, patched, with default credentials changed and strong authentication enforced?
  type: Preventive
  ev: Management network diagram; BMC inventory with firmware versions; firewall rules for the management VLAN; BMC user list and authentication settings
  proc: |-
    From an authorised host on the management VLAN, discover IPMI exposure with `nmap -sU -p 623 --script ipmi-version <mgmt-subnet>` and confirm IPMI-over-LAN is disabled or restricted.
    Review BMC accounts, TLS certificate and firmware date in the web console or via Redfish (`curl -k -u <user> https://<bmc>/redfish/v1/Managers`).
    Confirm the BMC subnet is unreachable from user and internet segments (`nc -vz <bmc-ip> 443` from a user VLAN should fail).
  test: INT,CFG,TECH
  auto: Medium
  autom: Redfish API inventory of firmware versions and accounts; vendor tools (OpenManage, iLO RESTful API).
  L: 3
  I: 5
  w: 3
  m1: BMCs reachable from the production LAN with default credentials.
  m3: Dedicated management VLAN, unique credentials, firmware versions tracked.
  m5: Access only via MFA jump host, Redfish-driven firmware compliance, IPMI-over-LAN disabled, BMC configuration baselined and monitored.
  rem: Move BMCs to an isolated management network, change all default credentials, disable IPMI-over-LAN or restrict it, patch firmware, and require access through a hardened jump host.
  iso: A.8.9, A.8.20, A.8.22
  csf: PR.IR-01, PR.PS-01
  cis: '4.6, 12.2'
  soc: CC6.1, CC6.6
  att: 'IA:T1190 | PS:T1542.001'
  zt: NW,IN
  orig: New

- id: SRV-PHY-03
  name: Removable media and unused ports are controlled
  plat: All
  obj: Reduce the risk of malware introduction and data removal through USB, optical, serial and console ports.
  biz: Removable media remains a path for malware delivery and unmonitored data exfiltration from servers.
  thr: Malware via removable media, boot from unauthorised media, data exfiltration.
  q: Are USB and removable-media ports, unused console ports and boot-from-removable options disabled or controlled on servers?
  type: Preventive
  ev: GPO, MDM, udev or USBGuard configuration; BIOS/UEFI boot-order settings; media handling policy; exception register
  proc: |-
    Windows: `reg query HKLM\SYSTEM\CurrentControlSet\Services\USBSTOR /v Start` (value 4 means disabled) and review the GPO "Removable Storage Access".
    Linux: `lsmod | grep usb_storage`, `systemctl status usbguard`, `grep -r usb-storage /etc/modprobe.d/`.
    Review UEFI boot order and boot-device password settings for a sample of physical servers.
  test: CFG,OBS,TECH
  auto: Medium
  autom: GPO or Intune export; Ansible or OpenSCAP check for a blacklisted usb-storage module.
  L: 2
  I: 4
  w: 1
  m1: Ports and boot options are open on all servers.
  m3: Removable storage blocked by policy, boot order locked, exceptions approved.
  m5: Device control enforced by EDR with alerts on blocked attempts, quarterly exception review.
  rem: Block removable storage by policy, lock boot order with a firmware password, and use EDR device control with alerting where USB access is needed.
  iso: A.7.10, A.8.9
  csf: PR.PS-01
  cis: '4.8, 10.3'
  soc: CC6.7
  att: 'IA:T1091'
  zt: IN
  orig: New

- id: SRV-PHY-04
  name: Storage media is sanitised or destroyed before replacement and disposal
  plat: All
  obj: Ensure data cannot be recovered from storage devices that are replaced, returned, re-used or retired.
  biz: Discarded drives and vendor returns are a recurring source of confidential data exposure and regulatory breaches.
  thr: Data recovery from discarded drives, leakage through vendor RMA returns.
  q: Is media containing confidential data sanitised to a recognised standard or destroyed, with certificates retained, before leaving the organisation or being re-used?
  type: Preventive
  ev: Media disposal procedure; certificates of destruction; asset disposal log; RMA records; encryption-at-rest evidence for returned drives
  proc: |-
    Sample 5 retired or RMA-returned servers from the asset register and trace each to a sanitisation record or destruction certificate.
    Confirm the sanitisation method meets NIST SP 800-88 (clear, purge or destroy) and that crypto-erase is evidenced where self-encrypting drives are used.
    Review vendor contracts for media retention or "keep your drive" clauses.
  test: INT,DOC
  auto: Low
  autom: ITAM workflow that blocks asset closure without an attached sanitisation certificate.
  L: 2
  I: 4
  w: 2
  m1: Drives are discarded or returned without a defined process.
  m3: Documented sanitisation standard, certificates retained for most disposals.
  m5: Full-disk encryption plus crypto-erase on every retirement, automated closure checks, periodic vendor audits.
  rem: Adopt a media sanitisation standard aligned to NIST SP 800-88, require certificates for every disposal, and add contract clauses for vendor-held media.
  iso: A.7.14, A.7.10, A.8.10
  csf: ID.AM-08, PR.DS-01
  cis: '3.5'
  soc: CC6.5
  att: 'CO:T1005'
  zt: DT
  orig: '11.1'

- id: SRV-CFG-01
  name: Secure configuration baselines are defined for every server platform
  plat: All
  obj: Ensure servers are built to an approved, hardened and documented configuration.
  biz: Insecure defaults and inconsistent builds are a leading cause of avoidable compromise and audit findings.
  thr: Exploitation of insecure defaults and misconfiguration.
  q: Is there an approved hardening baseline (for example CIS Benchmark level) for each server OS and role, and is it applied at build?
  type: Preventive
  ev: Baseline standard per OS; golden image or build pipeline definitions (Packer, MDT, Ansible, Terraform); sample build checklist; exceptions register
  proc: |-
    Obtain baselines and confirm they track a current CIS Benchmark or Microsoft security baseline version.
    Sample 5 servers and measure compliance. Windows: Microsoft Security Compliance Toolkit (Policy Analyzer) or CIS-CAT. Linux: `oscap xccdf eval --profile <cis-profile> --report out.html <ssg-datastream>` or `lynis audit system`.
    Record the percentage of controls passed and review the exceptions register for approval and expiry.
  test: DOC,CFG,TECH,AUTO
  auto: High
  autom: OpenSCAP, CIS-CAT or Lynis scheduled scans; Microsoft Defender for Cloud or Intune configuration assessment; Ansible check mode.
  L: 4
  I: 4
  w: 3
  m1: Servers are built manually from the vendor defaults.
  m3: Documented baselines per platform applied through build scripts, exceptions approved.
  m5: Baselines versioned as code, continuously assessed with automated compliance scoring, drift auto-remediated.
  rem: Adopt a CIS or vendor baseline per platform, encode it in build automation, and track exceptions with expiry dates.
  iso: A.8.9
  csf: PR.PS-01
  cis: '4.1'
  soc: CC5.2, CC7.1
  att: 'IA:T1190 | EX:T1059 | DE:T1562'
  zt: IN
  orig: New
  owasp: A05
  asvs: V14

- id: SRV-CFG-02
  name: Configuration drift from the baseline is detected and corrected
  plat: All
  obj: Detect and remediate deviations from approved configurations in a timely way.
  biz: Unmanaged drift silently erodes hardening and can mask malicious modification.
  thr: Gradual misconfiguration, unauthorised changes, attacker persistence settings left unnoticed.
  q: Is compliance with the baseline continuously or periodically assessed, with deviations tracked to closure?
  type: Detective
  ev: Compliance scan reports (last 3 cycles); remediation tickets; scan schedule; compliance dashboards
  proc: |-
    Obtain the latest compliance scan and trend. Windows: `Get-DscConfigurationStatus` if DSC is used, or the Intune and Defender for Endpoint secure configuration export. Linux: `ansible-playbook site.yml --check --diff` or `aide --check`.
    Select 3 failed items and verify each has an owner, a ticket and a remediation date.
  test: DOC,TECH,AUTO
  auto: High
  autom: Scheduled OpenSCAP, Ansible check mode, Intune compliance reports, Defender for Cloud recommendations.
  L: 3
  I: 3
  w: 2
  m1: No drift checks; configuration is reviewed only after incidents.
  m3: Periodic compliance scans with tracked remediation.
  m5: Continuous drift detection with automatic reversion and compliance trend reporting to management.
  rem: Schedule automated baseline scans, route failures to owners via tickets, and auto-remediate low-risk drift.
  iso: A.8.9, A.8.16
  csf: PR.PS-01, DE.CM-09
  cis: '4.1'
  soc: CC7.1
  att: 'DE:T1562 | PS:T1543'
  zt: IN
  orig: New

- id: SRV-CFG-03
  name: Unnecessary services, roles, features and ports are disabled or removed
  plat: All
  obj: Minimise attack surface by running only what each server role requires.
  biz: Every unneeded service is an additional vulnerability and monitoring burden.
  thr: Exploitation of unused or legacy services (SMBv1, telnet, FTP, print spooler on non-print servers).
  q: Are all services, roles, features, protocols and listening ports not required by the server role disabled or removed?
  type: Preventive
  ev: Service and role inventory per server; listening-port list; change records for removals; scan results
  proc: |-
    Windows: `Get-WindowsFeature | where Installed`, `Get-Service | where Status -eq Running`, `Get-NetTCPConnection -State Listen`, `Get-SmbServerConfiguration | select EnableSMB1Protocol`.
    Linux: `systemctl list-unit-files --state=enabled`, `ss -tulpn`, and check for telnet, rsh and ftp packages with `rpm -qa` or `dpkg -l`.
    Compare results with the documented role requirement and record unexplained services.
  test: CFG,TECH,AUTO
  auto: High
  autom: osquery (listening_ports, services tables), Ansible facts, scheduled Nmap scans.
  L: 3
  I: 4
  w: 3
  m1: Default installs with all services enabled.
  m3: Role-based builds with documented service lists; periodic review.
  m5: Minimal images, automated detection of unauthorised services and ports with alerts.
  rem: Build from minimal images, remove or disable unneeded services, and alert on newly listening ports.
  iso: A.8.9, A.8.19
  csf: PR.PS-01
  cis: '4.8'
  soc: CC6.1, CC6.6
  att: 'IA:T1190 | LM:T1021'
  zt: IN
  orig: '4.3'
  owasp: A05
  asvs: V14

- id: SRV-CFG-04
  name: An approved authorised-use banner is displayed at login
  plat: All
  obj: Establish a legal notice of authorised use at every administrative login interface.
  biz: A banner supports lawful monitoring and enforcement and is commonly required by regulators and insurers.
  thr: Disputed unauthorised-access enforcement and claims of implied consent.
  q: Do servers display a legally approved authorised-use notice at console, SSH, RDP and web administration logins?
  type: Preventive
  ev: Legal-approved banner text; screenshots of console, SSH and RDP logins; GPO or sshd configuration; exception list
  proc: |-
    Windows: `reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v legalnoticetext`.
    Linux: `sshd -T | grep -i banner` and `cat /etc/issue /etc/issue.net`.
    Attempt a login to confirm the banner appears and record any interface where it is technically impossible.
  test: CFG,OBS,TECH
  auto: High
  autom: GPO export or Ansible lineinfile check.
  L: 1
  I: 2
  w: 1
  m1: No banner configured.
  m3: Legal-approved banner deployed to all administrative interfaces.
  m5: Banner enforced as code with drift alerts and annual legal review.
  rem: Obtain legal-approved wording and deploy it by GPO or configuration management to all login interfaces.
  iso: A.5.10, A.8.5
  csf: GV.PO-01
  cis: N/A
  soc: CC6.1
  att: N/A
  zt: ID
  orig: '1.4'

- id: SRV-CFG-05
  name: Boot chain integrity protections are enabled
  plat: All
  obj: Ensure the server only boots trusted firmware and operating system components.
  biz: Bootkits and firmware implants survive reinstallation and evade operating-system security tools.
  thr: Bootkits, firmware implants, boot from unauthorised media.
  q: Are Secure Boot, a UEFI/BIOS administrator password, TPM-backed measured boot and restricted boot order enabled on physical and virtual servers where supported?
  type: Preventive
  ev: UEFI settings exports or screenshots; Secure Boot and TPM status output; virtual machine firmware settings; exception list
  proc: |-
    Windows: `Confirm-SecureBootUEFI`, `Get-Tpm`, and msinfo32 (BIOS Mode UEFI, Secure Boot State On).
    Linux: `mokutil --sb-state`, `ls /sys/firmware/efi`, and `tpm2_pcrread` where tpm2-tools is installed.
    Hyper-V guests: `Get-VMFirmware -VMName <vm> | select SecureBoot`. List legacy-BIOS machines as exceptions.
  test: CFG,TECH,AUTO
  auto: Medium
  autom: Defender for Endpoint or Intune device health attestation; osquery secureboot table; Redfish BIOS attributes.
  L: 2
  I: 4
  w: 2
  m1: Legacy BIOS boot with no firmware protection.
  m3: Secure Boot and firmware password on most servers, exceptions documented.
  m5: Measured boot with remote attestation and firmware settings monitored for change.
  rem: Convert to UEFI, enable Secure Boot and TPM, set firmware passwords, and restrict boot devices.
  iso: A.8.9
  csf: PR.PS-01, PR.DS-06
  cis: '4.1'
  soc: CC6.8
  att: 'PS:T1542 | DE:T1014'
  zt: DV,IN
  orig: '4.1, 4.7'

- id: SRV-CFG-06
  name: Server configuration changes follow documented change control
  plat: All
  obj: Ensure changes are assessed, approved, tested and traceable.
  biz: Uncontrolled change causes outages and security regressions, and obscures malicious modification.
  thr: Unauthorised or untested changes, concealed malicious changes.
  q: Is there a documented change process for server configuration (request, risk review, approval, test, rollback, post-change review) and is it followed?
  type: Preventive
  ev: Change management policy; sample of 10 change tickets; CAB minutes; emergency change log; configuration repository history
  proc: |-
    Sample 10 recent system changes from the configuration repository or logs and trace each to an approved ticket (target 90% match or better).
    Windows: `Get-WinEvent -FilterHashtable @{LogName='Security';Id=4719}` (audit policy changes). Linux: `ausearch -k config_change`, `dnf history` or `/var/log/dpkg.log`.
    Review emergency changes for after-the-fact approval.
  test: DOC,INT,TECH
  auto: Medium
  autom: ITSM-to-CMDB reconciliation; Ansible Tower/AWX job logs; mandatory ticket reference in Git commits.
  L: 3
  I: 3
  w: 2
  m1: Changes made ad hoc by administrators.
  m3: Documented process with approval and testing; sampled evidence of compliance.
  m5: Pipeline-enforced change with automatic ticket linkage, metrics, and unauthorised-change alerting.
  rem: Implement a change process with risk-based approval, rollback plans and automated reconciliation of detected changes to tickets.
  iso: A.8.32, A.8.9
  csf: PR.PS-01
  cis: '4.1'
  soc: CC8.1
  att: 'PS:T1543 | DE:T1562'
  zt: IN
  orig: '4.2'

- id: SRV-CFG-07
  name: Only authorised software can execute or be installed on servers
  plat: All
  obj: Prevent execution of unapproved binaries and scripts.
  biz: Application allow-listing blocks the majority of commodity malware and living-off-the-land tooling.
  thr: Ransomware and malware execution, attacker tooling, unauthorised software.
  q: Is application allow-listing or equivalent execution control enforced on servers, and is software installation restricted to approved administrators and sources?
  type: Preventive
  ev: AppLocker or WDAC policy export; fapolicyd or SELinux/AppArmor configuration; software inventory against approved list; audit-mode results
  proc: |-
    Windows: `Get-AppLockerPolicy -Effective -Xml` and `Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard` (code integrity enforcement status).
    Linux: `systemctl status fapolicyd`, `getenforce` or `aa-status`.
    Compare the software inventory with the approved list and confirm policies are in enforce mode, not audit.
  test: CFG,TECH,AUTO
  auto: Medium
  autom: Intune or GPO policy export; osquery programs table; EDR application control reports.
  L: 3
  I: 4
  w: 2
  m1: Any software can be installed or run.
  m3: Allow-listing enforced for critical servers, installs restricted.
  m5: Enforced allow-listing on all servers with managed exception workflow and violation alerting.
  rem: Deploy WDAC/AppLocker or fapolicyd in audit mode, tune, then enforce; restrict installation rights.
  iso: A.8.19, A.8.7
  csf: PR.PS-05
  cis: '2.3, 2.5'
  soc: CC6.8
  att: 'EX:T1059 | DE:T1574 | IM:T1486'
  zt: AP,IN
  orig: New

- id: SRV-PAT-01
  name: A documented patch management process with risk-based timelines exists
  plat: All
  obj: Ensure operating systems, applications and firmware are patched within defined timeframes.
  biz: Known unpatched vulnerabilities remain the most common route to server compromise and ransomware.
  thr: Exploitation of known vulnerabilities.
  q: Is there a documented patch process defining roles, schedules, severity-based timelines, testing, exceptions and coverage of OS, applications and firmware?
  type: Preventive
  ev: Patch policy or standard; patch calendar; timeline (SLA) table; records from two recent patch cycles; exception log
  proc: |-
    Review the policy for timelines by severity and exploitation status, and for coverage of third-party applications, firmware and hypervisors.
    Sample the last two patch cycles: scope versus asset inventory, approvals, test evidence and deployment rate.
    Confirm where the process is documented and who owns it.
  test: DOC,INT,TECH
  auto: High
  autom: WSUS, Intune, Update Manager or Red Hat Satellite compliance exports via API.
  L: 4
  I: 5
  w: 3
  m1: Patching is ad hoc and left to individual administrators.
  m3: Documented process and calendar, timelines defined, most servers patched in time.
  m5: Automated patching with measured timelines, exception governance and threat-led acceleration.
  rem: Define severity and exploitability-based patch timelines, assign ownership, and automate deployment with compliance reporting.
  iso: A.8.8, A.5.37
  csf: ID.RA-01, PR.PS-02
  cis: '7.3, 7.4'
  soc: CC7.1
  att: 'IA:T1190 | PE:T1068 | IM:T1486'
  zt: IN
  orig: '2.1, 2.3, 2.4'
  owasp: A06

- id: SRV-PAT-02
  name: Patch currency is verified per server and installation failures are resolved
  plat: All
  obj: Know the real patch level of each server and detect failed or pending installations.
  biz: Reported patch compliance often overstates reality when failures and pending reboots go unnoticed.
  thr: Unpatched systems believed to be compliant.
  q: Can the organisation show the current patch level per server, and are failed or pending installations detected and resolved?
  type: Detective
  ev: Patch compliance report; failed-installation report; tickets for failures; pending-reboot report
  proc: |-
    Windows: `Get-HotFix | sort InstalledOn -Descending | select -First 10`; pending reboot via registry key `HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending`.
    Linux: `apt list --upgradable` or `dnf updateinfo list security`; `needs-restarting -r` or `/var/run/reboot-required`.
    Compare results with the console report and timelines; sample failed installs against tickets.
  test: CFG,TECH,AUTO
  auto: High
  autom: Patch console exports, Defender TVM, Nessus credentialed patch audit plugins.
  L: 4
  I: 4
  w: 3
  m1: Patch level is unknown outside manual checks.
  m3: Per-server patch inventory with failure monitoring.
  m5: Automated reconciliation of console data and scanner results, failures auto-ticketed.
  rem: Reconcile patch tooling reports against credentialed scans, auto-ticket failures, and track pending reboots.
  iso: A.8.8
  csf: ID.RA-01, PR.PS-02
  cis: '7.3, 7.4, 7.7'
  soc: CC7.1
  att: 'IA:T1190 | PE:T1068'
  zt: IN
  orig: '2.5, 2.6'

- id: SRV-PAT-03
  name: Unsupported and end-of-life systems are governed through approved exceptions
  plat: All
  obj: Prevent unsupported platforms from running without compensating controls and a retirement plan.
  biz: End-of-life systems receive no security fixes and are routinely used for initial access and lateral movement.
  thr: Unpatchable vulnerabilities in end-of-life operating systems and applications.
  q: Are operating systems and applications beyond vendor support identified and either removed, isolated, or covered by a time-bound, risk-accepted exception with compensating controls?
  type: Preventive
  ev: End-of-life inventory with dates; exception register with approvals and expiry; compensating-control evidence; migration roadmap
  proc: |-
    Windows: `Get-CimInstance Win32_OperatingSystem | select Caption,Version`. Linux: `cat /etc/os-release`.
    Compare every server against the vendor lifecycle (vendor pages or endoflife.date), for example Windows Server 2012 R2 or CentOS 7.
    For each end-of-life host, verify an approved exception, an expiry date, and isolation or monitoring as compensating controls.
  test: DOC,TECH,AUTO
  auto: High
  autom: CMDB lifecycle fields plus scanner "unsupported operating system" findings.
  L: 4
  I: 5
  w: 3
  m1: Unsupported systems are unknown or unmanaged.
  m3: Inventory of end-of-life systems with approved, dated exceptions.
  m5: Lifecycle-driven roadmap, no unmanaged end-of-life systems, automatic alerts ahead of support end.
  rem: Inventory support dates, migrate or isolate end-of-life hosts, and require time-bound exceptions signed by the risk owner.
  iso: A.8.8, A.5.9
  csf: ID.AM-08, PR.PS-02
  cis: '2.2'
  soc: CC7.1
  att: 'IA:T1190 | PE:T1068 | LM:T1021'
  zt: IN
  orig: '2.2'
  owasp: A06

- id: SRV-PAT-04
  name: Emergency patching exists for actively exploited and critical vulnerabilities
  plat: All
  obj: Compress time-to-remediate for vulnerabilities with known exploitation.
  biz: Exploits are often weaponised within days of disclosure; routine cycles are too slow for these cases.
  thr: Rapid exploitation of newly disclosed vulnerabilities.
  q: Is there a tested fast-track process for actively exploited or critical vulnerabilities (including CISA KEV entries), with timelines that are measured and met?
  type: Corrective
  ev: Emergency patch procedure; threat-intelligence or KEV subscription; last 3 emergency events with timelines; time-to-patch metrics
  proc: |-
    Select 3 recent KEV or critical CVEs affecting the estate and measure disclosure-to-remediation time per server.
    Compare with the target. The source checklist required remediation of CVSS 7 or higher within one business day; this framework recommends risk-based targets (for example internet-facing KEV within 72 hours).
    Verify mitigations for systems that cannot be patched immediately.
  test: DOC,INT,TECH
  auto: Medium
  autom: KEV feed correlated with scanner or Defender TVM asset data.
  L: 4
  I: 5
  w: 3
  m1: No emergency process; critical patches wait for the monthly cycle.
  m3: Defined fast-track with owners; usually met for internet-facing systems.
  m5: Threat-intel triggered automation with measured, consistently met targets.
  rem: Subscribe to KEV and vendor advisories, define emergency timelines by exposure, and rehearse the process.
  iso: A.8.8, A.5.7
  csf: ID.RA-01, ID.RA-02
  cis: '7.7'
  soc: CC7.1
  att: 'IA:T1190 | EX:T1059 | IM:T1486'
  zt: IN
  orig: '5.6'

- id: SRV-PAT-05
  name: Firmware and hypervisor layers are inventoried and patched
  plat: All
  obj: Keep BIOS/UEFI, BMC, controller, NIC firmware and hypervisor builds current.
  biz: Firmware and hypervisor flaws affect every workload above them and are often missed by OS patching.
  thr: Firmware implants, hypervisor escape and ESXi-targeting ransomware exploits.
  q: Are firmware and hypervisor versions inventoried and patched on a managed cadence?
  type: Preventive
  ev: Firmware inventory (OpenManage, iLO, Redfish); hypervisor build numbers versus vendor advisories; firmware change tickets
  proc: |-
    VMware: `Get-VMHost | select Name,Version,Build` (PowerCLI). Hyper-V: `Get-ComputerInfo`. Proxmox: `pveversion -v`.
    Redfish: `curl -k -u <user> https://<bmc>/redfish/v1/UpdateService/FirmwareInventory`.
    Compare against current vendor security advisories and note hosts behind the supported builds.
  test: CFG,TECH,AUTO
  auto: Medium
  autom: Redfish and vendor management APIs; PowerCLI scheduled reports.
  L: 3
  I: 5
  w: 2
  m1: Firmware is never updated after installation.
  m3: Annual firmware cycle and tracked hypervisor patching.
  m5: Continuous firmware compliance reporting and risk-based expedited updates.
  rem: Inventory firmware and hypervisor versions, subscribe to vendor advisories, and schedule updates with maintenance windows.
  iso: A.8.8, A.7.13
  csf: PR.PS-02, PR.PS-03
  cis: '7.3'
  soc: CC7.1
