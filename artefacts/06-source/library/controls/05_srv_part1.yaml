- id: SRV-LOG-01
  name: Security-relevant events are logged on every server
  plat: All
  obj: Generate the audit trail needed to detect and investigate compromise.
  biz: Without logs, intrusions cannot be detected, scoped or proven, and regulatory obligations cannot be met.
  thr: Undetected compromise and loss of forensic evidence.
  q: Are authentication, privilege use, account and group changes, access-control changes, scheduled job and service creation, and system integrity events logged with timestamps?
  type: Detective
  ev: Audit policy export; auditd and rsyslog configuration; sample log events; log source inventory
  proc: |-
    Windows: `auditpol /get /category:*`; `Get-WinEvent -ListLog Security | select LogName,MaximumSizeInBytes`; confirm events 4624, 4625, 4672, 4720, 4728, 4732, 4697, 4698 and 7045 occur; check PowerShell script block logging at `HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging`.
    Linux: `systemctl is-active auditd`, `auditctl -l` (look for rules on /etc/passwd, /etc/shadow, sudoers and execve), `last -n 20`.
  test: CFG,TECH,AUTO
  auto: High
  autom: GPO and auditd configuration exports; Ansible audit role; osquery event tables.
  L: 4
  I: 4
  w: 3
  m1: Default logging only.
  m3: Defined audit policy applied consistently with timestamps and critical events covered.
  m5: Threat-informed audit policy (including command-line and script logging) validated by detection tests.
  rem: Enable advanced audit policy, auditd rules and PowerShell logging aligned to a documented logging standard.
  iso: A.8.15, A.8.16
  csf: PR.PS-04, DE.CM-09
  cis: '8.2, 8.5'
  soc: CC7.2
  att: 'DE:T1562.002, T1070.001'
  zt: IN
  orig: '3.1, 3.5'
  owasp: A09

- id: SRV-LOG-02
  name: Logs are forwarded in near real time to a central tamper-resistant store
  plat: All
  obj: Preserve evidence off-host and detect log tampering or forwarding failure.
  biz: Attackers routinely clear local logs; central storage preserves evidence and enables correlation.
  thr: Log clearing, loss of evidence, single point of failure on the host.
  q: Are logs forwarded in near real time to a central, access-restricted platform, with alerts when forwarding stops or logs are cleared?
  type: Detective
  ev: SIEM log-source health dashboard; forwarder configuration (WEF/WEC, Azure Monitor Agent, rsyslog, Splunk UF); alert rules for log clearing and silent sources
  proc: |-
    Windows: `wecutil gs <subscription>` or check the agent service. Linux: `grep -R "omfwd" /etc/rsyslog.conf /etc/rsyslog.d/`.
    In the SIEM, verify last-event time per server (stale beyond 15 minutes is a gap).
    Generate benign test events: `logger -p auth.notice "SAOS-test"` and `eventcreate /T INFORMATION /ID 999 /L APPLICATION /SO SAOS /D "test"`, then confirm arrival.
    Confirm an alert exists for Security log cleared (event 1102).
  test: CFG,TECH,AUTO
  auto: High
  autom: SIEM API for last-seen per source; synthetic heartbeat events.
  L: 4
  I: 5
  w: 3
  m1: Logs remain only on local servers.
  m3: Central collection for most servers with documented coverage.
  m5: Complete coverage with write-once storage, heartbeat monitoring and log-clear alerts.
  rem: Deploy forwarders to all servers, send to a restricted SIEM or log store, and alert on silent sources and log clearing.
  iso: A.8.15, A.8.16
  csf: PR.PS-04, DE.CM-09, DE.AE-02
  cis: '8.9, 13.1'
  soc: CC7.2
  att: 'DE:T1070.001, T1070.002, T1562.002'
  zt: IN
  orig: '3.7'
  owasp: A09

- id: SRV-LOG-03
  name: Log retention satisfies investigation and regulatory needs
  plat: All
  obj: Keep logs long enough to investigate incidents that are discovered late.
  biz: Intrusions are often found weeks after initial access; short retention destroys the evidence needed to scope them.
  thr: Loss of forensic evidence when local logs roll over.
  q: Is log retention (online and archive) defined to meet investigation and regulatory requirements, and are local log sizes sufficient to prevent early overwrite?
  type: Detective
  ev: Retention policy; SIEM retention configuration; local log size settings; regulatory retention requirements
  proc: |-
    Windows: `wevtutil gl Security` (maxSize and retention). Linux: `journalctl --disk-usage` and `grep -E 'max_log_file|num_logs' /etc/audit/auditd.conf`.
    Confirm the SIEM can return events older than the required window. The source checklist required at least 2 weeks locally; this framework recommends at least 90 days online and 12 months archived, subject to regulation.
  test: DOC,CFG,TECH
  auto: High
  autom: SIEM retention API; scripted check of oldest available event per source.
  L: 3
  I: 3
  w: 2
  m1: Logs overwrite quickly with no retention requirement.
  m3: Retention defined and configured to policy.
  m5: Tiered retention aligned to regulation and threat profile, validated by periodic retrieval tests.
  rem: Set minimum retention (online and archive) by data class and regulation, and size local logs to cover forwarding outages.
  iso: A.8.15, A.5.33
  csf: PR.PS-04
  cis: '8.3, 8.10'
  soc: CC7.2
  att: 'DE:T1070.001'
  zt: IN
  orig: '3.5'

- id: SRV-LOG-04
  name: Sensitive data is excluded from logs and log files are protected
  plat: All
  obj: Prevent logs from becoming a store of credentials or personal data.
  biz: Credentials and personal data in logs create breach exposure and privacy compliance failures.
  thr: Credential exposure through logs and privacy breaches.
  q: Is logging configured to exclude passwords, secrets, tokens and sensitive personal data, and are log files access-restricted?
  type: Preventive
  ev: Application logging configuration; sample log review; log file permission listings; secret-scan results for log stores
  proc: |-
    Windows: review process command-line auditing (event 4688) and PowerShell transcripts for secrets.
    Linux: `grep -riE "password=|passwd|secret|token" /var/log 2>/dev/null | head` and `ls -l /var/log`.
    With authorisation, run `gitleaks detect --no-git -s /var/log` or `trufflehog filesystem /var/log`.
  test: CFG,TECH,AUTO
  auto: Medium
  autom: Secret scanners against log stores; SIEM masking and data-loss rules.
  L: 3
  I: 4
  w: 2
  m1: Logs contain secrets and are world-readable.
  m3: Logging standard prohibits sensitive data and permissions are restricted.
  m5: Automated secret scanning of logs with masking at source.
  rem: Mask sensitive fields at source, restrict log permissions, and scan log stores for secrets.
  iso: A.8.15, A.5.34
  csf: PR.DS-01, PR.PS-04
  cis: '3.3'
  soc: CC6.1
  att: 'CA:T1552.001'
  zt: DT
  orig: '3.6'
  asvs: V7

- id: SRV-LOG-05
  name: Log monitoring and alert triage run on a defined schedule and are reviewed for effectiveness
  plat: All
  obj: Ensure collected logs are actually examined and that monitoring quality is measured.
  biz: Logs that are never reviewed give a false sense of assurance.
  thr: Missed intrusions despite available evidence.
  q: Is there a documented, scheduled monitoring and triage process with defined detection use cases, ownership, and an effectiveness review at least monthly?
  type: Detective
  ev: Log monitoring procedure and schedule; server use-case catalogue; triage records; monthly review minutes; detection metrics
  proc: |-
    Review the procedure and schedule and sample 3 months of review evidence.
    Select 5 use cases (new local administrator, service creation, failed-logon spike, audit log cleared, new SSH key) and trigger benign test events.
    Verify alerts fire, are triaged and result in tickets within the target time.
  test: DOC,INT,TECH
  auto: Medium
  autom: SIEM detection rules as code; purple-team or Atomic Red Team test execution.
  L: 3
  I: 4
  w: 3
  m1: No defined monitoring; logs reviewed only after incidents.
  m3: Documented schedule and use cases with evidence of triage.
  m5: Measured detection coverage against ATT&CK with regular testing and tuning.
  rem: Define server detection use cases, assign monitoring ownership, and review detection performance monthly.
  iso: A.8.15, A.8.16
  csf: DE.CM-09, DE.AE-02, DE.AE-03
  cis: '8.11, 13.1'
  soc: CC7.2, CC7.3
  att: 'DE:T1070, T1562'
  zt: IN
  orig: '3.2, 3.3, 3.4'
  owasp: A09

- id: SRV-LOG-06
  name: Servers use authoritative time and name-resolution sources
  plat: All
  obj: Ensure consistent time for log correlation and authentication, and trustworthy name resolution.
  biz: Inconsistent time breaks forensic timelines and Kerberos; untrusted DNS enables redirection attacks.
  thr: Log correlation failure, authentication failures, DNS spoofing.
  q: Do all servers synchronise time from authoritative, resilient sources and use authorised DNS resolvers?
  type: Preventive
  ev: NTP configuration; DNS resolver configuration; time status output; AD time hierarchy documentation
  proc: |-
    Windows: `w32tm /query /status`, `w32tm /query /source`, `Get-DnsClientServerAddress` (domain members should follow the domain hierarchy; the PDC emulator syncs to a reliable external source).
    Linux: `chronyc sources -v`, `timedatectl show`, `resolvectl status` or `cat /etc/resolv.conf`.
    Confirm clock offset is well under one second and resolvers are the approved internal servers.
  test: CFG,TECH,AUTO
  auto: High
  autom: Fleet-wide chrony/w32tm offset reports; DNS configuration compliance checks.
  L: 2
  I: 3
  w: 2
  m1: Clocks drift and resolvers are set arbitrarily.
  m3: Authoritative time and DNS sources defined and configured.
  m5: Redundant authenticated time sources with offset monitoring and alerts.
  rem: Standardise time sources and resolvers in the build baseline and monitor clock offset.
  iso: A.8.17
  csf: PR.PS-04
  cis: '4.9, 8.4'
  soc: CC7.2
  att: 'CA:T1557'
  zt: IN,NW
  orig: '12.2'

- id: SRV-HST-01
  name: Anti-malware or EDR is deployed, current and tamper-protected on servers
  plat: All
  obj: Detect and block malicious code and behaviour on servers.
  biz: Servers are prime ransomware targets; endpoint protection is a baseline expectation of insurers and regulators.
  thr: Malware and ransomware execution, defence tampering.
  q: Is anti-malware or EDR installed on all servers with real-time protection, current signatures and engine, tamper protection, and monitored alerts?
  type: Preventive
  ev: EDR console deployment report; coverage versus inventory; exclusion list; tamper protection setting
  proc: |-
    Windows: `Get-MpComputerStatus | select AMServiceEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated,IsTamperProtected` and `Get-MpPreference | select ExclusionPath,ExclusionProcess`.
    Linux: `mdatp health` for Defender, or the vendor equivalent.
    Compare EDR-reported hosts with the inventory and review exclusions for breadth and approval.
  test: CFG,TECH,AUTO
  auto: High
  autom: EDR console API coverage report; Defender for Endpoint device inventory.
  L: 3
  I: 5
  w: 3
  m1: Protection absent or unmanaged on many servers.
  m3: Deployed on all servers with updates and central alerting.
  m5: Tamper-protected EDR on all servers with reviewed exclusions and response playbooks.
  rem: Deploy EDR to every server, enable tamper protection, and review exclusions quarterly.
  iso: A.8.7
  csf: DE.CM-09, PR.PS-05
  cis: '10.1, 10.2, 10.7'
  soc: CC6.8
  att: 'EX:T1059 | DE:T1562.001 | IM:T1486'
  zt: DV,IN
  orig: '4.4'

- id: SRV-HST-02
  name: A host firewall enforces default-deny inbound rules
  plat: All
  obj: Limit network access to each server to required services and sources.
  biz: Host firewalls contain lateral movement when perimeter and segmentation controls fail.
  thr: Lateral movement and service exposure.
  q: Is a host firewall enabled in default-deny inbound mode with rules limited to required services and management sources?
  type: Preventive
  ev: Firewall rule exports; GPO; nftables or firewalld configuration; rule review records
  proc: |-
    Windows: `Get-NetFirewallProfile | select Name,Enabled,DefaultInboundAction` and `Get-NetFirewallRule -Enabled True -Direction Inbound -Action Allow | select DisplayName,Profile`.
    Linux: `firewall-cmd --list-all`, `nft list ruleset`, `ufw status verbose` or `iptables -S`.
    Confirm the default inbound policy is block or drop and that rules restrict source addresses.
  test: CFG,TECH,AUTO
  auto: High
  autom: GPO, Intune or Ansible firewall policy export; OpenSCAP firewall rules.
  L: 3
  I: 4
  w: 3
  m1: Host firewall disabled.
  m3: Enabled with default-deny and role-based rules.
  m5: Source-restricted rules managed as code with periodic review and drift alerts.
  rem: Enable the host firewall in default-deny mode and scope rules to required ports and sources.
  iso: A.8.20, A.8.9
  csf: PR.IR-01
  cis: '4.4'
  soc: CC6.6
  att: 'LM:T1021 | DI:T1046 | DE:T1562.004'
  zt: NW,IN
  orig: '4.5'

- id: SRV-HST-03
  name: Host intrusion prevention and exploit mitigations are enabled
  plat: All
  obj: Block exploitation techniques and malicious behaviour at the host.
  biz: Prevention-mode controls on authentication servers protect the systems that hold the keys to the whole estate.
  thr: Memory-corruption exploitation and post-exploitation behaviour.
  q: Are host intrusion prevention and OS exploit mitigations enabled, and mandatory in prevention mode on authentication servers (domain controllers, identity providers, RADIUS, PAM)?
  type: Preventive
  ev: HIPS or EDR prevention policy; exploit-protection configuration; list of authentication servers with HIPS status
  proc: |-
    Windows: `Get-ProcessMitigation -System` and `Get-MpPreference | select -ExpandProperty AttackSurfaceReductionRules_Ids`.
    Linux: `sestatus` or `aa-status`, and `sysctl kernel.randomize_va_space kernel.kptr_restrict`.
    Confirm authentication servers run in prevention mode, not detect-only.
  test: CFG,TECH,AUTO
  auto: Medium
  autom: Defender ASR rule reporting; EDR policy export; OpenSCAP kernel hardening checks.
  L: 3
  I: 4
  w: 2
  m1: No host prevention capability.
  m3: Prevention enabled on critical and authentication servers.
  m5: Tuned prevention on all servers with measured block events and regular tests.
  rem: Enable exploit mitigations and ASR rules, and enforce prevention mode on authentication servers.
  iso: A.8.7, A.8.9
  csf: PR.PS-05, DE.CM-09
  cis: '10.5, 13.7'
  soc: CC6.8, CC7.2
  att: 'PE:T1068 | EX:T1059'
  zt: IN
  orig: '4.6'

- id: SRV-HST-04
  name: File and configuration integrity monitoring covers critical system paths
  plat: All
  obj: Detect unauthorised changes to system binaries, configuration and sensitive files.
  biz: Integrity monitoring detects web shells, rootkits and persistence that signature tools miss.
  thr: Web shells, binary tampering, rootkits, persistence mechanisms.
  q: Is file and configuration integrity monitoring in place for critical system files, binaries, configuration and registry paths, with alerting on unauthorised change?
  type: Detective
  ev: FIM policy and monitored paths; alert samples; baseline hash database; EDR or FIM console
  proc: |-
    Linux: `aide --check` or `tripwire --check`; confirm the AIDE database is stored read-only or off-host.
    Windows: Defender for Endpoint, Wazuh or Tripwire FIM; Sysmon events 11, 12 and 13 for file and registry activity.
    Make a controlled benign change to a monitored test file and confirm an alert is raised.
  test: TECH,AUTO
  auto: Medium
  autom: Wazuh, AIDE, Tripwire or EDR FIM with SIEM alerting.
  L: 3
  I: 4
  w: 2
  m1: No integrity monitoring.
  m3: FIM on critical servers and paths with alerts.
  m5: Comprehensive FIM with change-ticket correlation and automated triage.
  rem: Deploy FIM on critical paths, protect baselines off-host, and correlate alerts with approved changes.
  iso: A.8.16, A.8.9
  csf: PR.DS-06, DE.CM-09
  cis: '4.1'
  soc: CC7.1
  att: 'PS:T1505, T1547 | DE:T1014'
  zt: IN
  orig: '4.7'
