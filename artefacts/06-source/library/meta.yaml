# SAOS master library - domain registry and family metadata
# Targets 1-15 are taken from the project specification. Domain 16 target (50) is an assumption. Domains 17-18 are placeholders.
domains:
  - {num: 1,  code: GOV, name: Governance, target: 50, batch: 'Batch 2', scope: 'Security strategy, program, policies, standards, procedures, framework alignment, risk governance, third-party governance'}
  - {num: 2,  code: AST, name: Asset Management, target: 25, batch: 'Batch 2', scope: 'Asset inventory, discovery, shadow IT, software, hardware, cloud assets, SaaS assets'}
  - {num: 3,  code: IAM, name: Identity and Access Management, target: 60, batch: 'Batch 1', scope: 'Active Directory (forest, trusts, tiering, admin accounts, GPO), Entra ID (MFA, Conditional Access, Identity Protection, access reviews, PIM), PAM (sessions, vaulting, JIT)'}
  - {num: 4,  code: END, name: Endpoint Security, target: 50, batch: 'Batch 3', scope: 'Windows, Linux, macOS, iOS, Android (including mobile device management)'}
  - {num: 5,  code: SRV, name: Server Security, target: 60, batch: 'Pilot (built)', scope: 'Windows Server, Linux Server, Hyper-V, VMware, Proxmox'}
  - {num: 6,  code: NET, name: Network Security, target: 75, batch: 'Batch 3', scope: 'Routers, switches, firewalls, VPN, wireless, NAC, IDS/IPS, DNS, proxy'}
  - {num: 7,  code: M365, name: Microsoft 365, target: 80, batch: 'Batch 1', scope: 'Exchange, Teams, SharePoint, OneDrive, Purview, Defender, Intune, Entra'}
  - {num: 8,  code: CLD, name: Cloud Security, target: 100, batch: 'Batch 1', scope: 'Azure, AWS, GCP: IAM, networking, storage, monitoring, logging, containers and Kubernetes'}
  - {num: 9,  code: APP, name: Application Security, target: 80, batch: 'Batch 4', scope: 'Secure SDLC, architecture, authentication, authorization, input validation, logging, secrets management'}
  - {num: 10, code: API, name: API Security, target: 40, batch: 'Batch 4', scope: 'OAuth, OIDC, JWT, rate limiting, API gateway, API logging'}
  - {num: 11, code: SOC, name: Security Operations, target: 70, batch: 'Batch 2', scope: 'Logging, SIEM, SOAR, threat intelligence, detection engineering, incident response'}
  - {num: 12, code: VLM, name: Vulnerability Management, target: 35, batch: 'Batch 2', scope: 'Discovery, scanning, prioritization, remediation, validation'}
  - {num: 13, code: DPR, name: Data Protection, target: 40, batch: 'Batch 3', scope: 'Classification, encryption, DLP, retention, privacy'}
  - {num: 14, code: BKP, name: Backup and Recovery, target: 30, batch: 'Batch 3', scope: 'Backups, replication, recovery, DR testing'}
  - {num: 15, code: DSO, name: DevSecOps, target: 60, batch: 'Batch 4', scope: 'CI/CD, repositories, secrets, containers, IaC'}
  - {num: 16, code: GWS, name: Google Workspace, target: 50, batch: 'Batch 4', scope: 'Admin console, identity and 2SV, Gmail, Drive, Meet, DLP, context-aware access (target 50 is an assumption)'}
  - {num: 17, code: OT, name: OT/ICS (future), target: 0, batch: 'Placeholder', scope: 'Reserved for operational technology and industrial control systems'}
  - {num: 18, code: AI, name: AI Systems (future), target: 0, batch: 'Placeholder', scope: 'Reserved for AI/ML systems, model supply chain, and AI governance'}

# Family metadata. ref = default references. iso_clause = ISO 27001:2022 management-system clauses (family level).
# app = ISO/IEC 27034 category default (Application Security Controls / Verification / Development / Runtime).
families:
  SRV-PHY: {name: Physical and Environmental Security, ref: 'NIST SP 800-53 Rev.5 PE family; ISO/IEC 27002:2022 clause 7; NIST SP 800-88 Rev.1 (media sanitization); vendor hardware hardening guides', iso_clause: '6.1.3, 8.1', app: 'N/A'}
  SRV-CFG: {name: Secure Configuration and Change, ref: 'CIS Benchmarks (Windows Server, RHEL, Ubuntu); Microsoft Security Baselines; DISA STIGs; NIST SP 800-123; NIST SP 800-70', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
  SRV-PAT: {name: Patch and Lifecycle Management, ref: 'NIST SP 800-40 Rev.4; CISA Known Exploited Vulnerabilities catalog; vendor lifecycle and support policies', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
  SRV-LOG: {name: Logging and Time Synchronization, ref: 'NIST SP 800-92; CIS Control 8; Microsoft Windows auditing guidance; CISA/ASD logging best-practice guidance', iso_clause: '6.1.3, 8.1, 9.1', app: 'Runtime'}
  SRV-HST: {name: Host Protection, ref: 'CIS Controls 10 and 13; Microsoft Defender documentation; vendor EDR hardening guides', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
  SRV-VUL: {name: Vulnerability Assessment, ref: 'NIST SP 800-115; NIST SP 800-40 Rev.4; CVSS specification (FIRST); EPSS; CISA KEV catalog', iso_clause: '6.1.2, 8.2, 9.1', app: 'Verification'}
  SRV-NET: {name: Network Placement and Exposure, ref: 'NIST SP 800-41 Rev.1; NIST SP 800-207; CIS Control 12', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
  SRV-IAM: {name: Authentication and Access Control, ref: 'NIST SP 800-63B; NIST SP 800-53 Rev.5 AC and IA families; CIS Controls 5 and 6; Windows LAPS documentation', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
  SRV-ADM: {name: Secure Administration, ref: 'NIST SP 800-53 Rev.5 AC-17; Microsoft privileged access (enterprise access model); CIS Controls 4 and 12', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
  SRV-BCK: {name: 'Backup, Restore and Recovery', ref: 'NIST SP 800-34 Rev.1; 3-2-1-1-0 backup practice; CIS Control 11', iso_clause: '6.1.3, 8.1', app: 'N/A'}
  SRV-DAT: {name: Data Protection, ref: 'NIST SP 800-111; NIST SP 800-52 Rev.2; CIS Control 3', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
  SRV-GOV: {name: 'Governance, Ownership and Risk', ref: 'ISO/IEC 27005; NIST SP 800-30 Rev.1; NIST SP 800-53 Rev.5 RA and SA families; ISO/IEC 27036 (supplier relationships)', iso_clause: '5.3, 6.1.2, 8.2', app: 'N/A'}
  SRV-VIR: {name: Virtualization Platforms, ref: 'VMware vSphere Security Configuration Guide; Microsoft Hyper-V security documentation; CIS Benchmarks (VMware ESXi); Proxmox VE administration guide; NIST SP 800-125', iso_clause: '6.1.3, 8.1', app: 'Runtime'}
